.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);padding:22px}

.btn{border:0;border-radius:999px;padding:11px 24px;font-size:1rem;cursor:pointer;background:var(--cor);color:var(--btx);text-decoration:none;display:inline-block;transition:transform .2s,box-shadow .2s}

.tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}

input{margin-bottom:10px}
footer{background:#1D5B5E;color:#fff;text-align:center;padding:40px 18px}footer h2{color:#fff}.sig{font-size:.8rem;opacity:.85;margin:18px 0 0;border-top:1px solid #ffffff33;padding-top:12px}footer a{color:#ffd9a0;margin:0 10px}

.conf{position:fixed;top:-30px;font-size:26px;animation:fl 2.5s linear forwards;z-index:60}@keyframes fl{to{transform:translateY(110vh) rotate(540deg)}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tbadge span{display:inline-block;background:#fbeed7;color:#7a4a08;border-radius:999px;padding:2px 16px;font-size:.875rem;font-weight:500}

h1:'العدالة ليست أن يتحدث الجميع بلغة واحدة، بل أن يُسمع الجميع مهما تحدثوا.|Justice is not for everyone to speak one language, but for everyone to be heard, however they speak.|Gerechtigkeit heißt nicht, dass alle dieselbe Sprache sprechen, sondern dass alle gehört werden – gleich, wie sie sprechen.|La giustizia non è che tutti parlino una sola lingua, ma che tutti vengano ascoltati, in qualunque modo parlino.|La justice, ce n’est pas que tout le monde parle une seule langue, mais que chacun soit entendu, quelle que soit sa façon de parler.|La justicia no es que todos hablen un mismo idioma, sino que todos sean escuchados, hablen como hablen.|公平不是让所有人说同一种语言，而是无论怎样说话，每个人都能被听见。|公正とは、皆が同じ言葉を話すことではなく、どんな話し方でも、誰もが聞いてもらえることです。|정의란 모두가 같은 언어로 말하는 것이 아니라, 어떻게 말하든 모두가 들리는 것입니다.',
h2:'اللغة ليست مجرد وسيلة للكلام، بل بوابة للوصول إلى المساعدة والاهتمام.. المشكلة ليست أنهم لا يتحدثون، بل أننا لا نستمع.|Language is not just a way to speak; it is a gateway to help and care. The problem is not that they don’t speak, but that we don’t listen.|Sprache ist nicht nur ein Mittel zum Sprechen, sondern ein Tor zu Hilfe und Fürsorge. Das Problem ist nicht, dass sie nicht sprechen, sondern dass wir nicht zuhören.|La lingua non è solo un mezzo per parlare, ma la porta verso aiuto e attenzione. Il problema non è che non parlino, ma che noi non ascoltiamo.|La langue n’est pas qu’un moyen de parler, c’est une porte vers l’aide et l’attention. Le problème n’est pas qu’ils ne parlent pas, mais que nous n’écoutons pas.|El idioma no es solo un medio para hablar, sino una puerta hacia la ayuda y el cuidado. El problema no es que no hablen, sino que no escuchamos.|语言不只是说话的工具，更是通往帮助与关怀的大门。问题不在于他们不说话，而在于我们不倾听。|言葉は話すための手段であるだけでなく、助けと思いやりへの入り口です。問題は彼らが話さないことではなく、私たちが耳を傾けないことです。|언어는 단지 말하는 수단이 아니라 도움과 보살핌으로 가는 관문입니다. 문제는 그들이 말하지 않는 것이 아니라, 우리가 듣지 않는 것입니다.',

m1b:'لا أحد يُقاس بلكنته. نترجم المعنى والمشاعر لتصل الفكرة كما أرادها صاحبها.|No one should be judged by their accent. We translate meaning and feeling so the idea arrives as intended.|Niemand sollte nach seinem Akzent beurteilt werden. Wir übersetzen Sinn und Gefühl, damit die Idee so ankommt, wie sie gemeint war.|Nessuno va giudicato dal suo accento. Traduciamo significato ed emozione perché l’idea arrivi come voluta.|Personne ne devrait être jugé sur son accent. Nous traduisons le sens et l’émotion pour que l’idée arrive telle que voulue.|Nadie debe ser juzgado por su acento. Traducimos el sentido y la emoción para que la idea llegue tal como se quiso.|没有人应因口音而被评判。我们翻译含义与情感，让想法如愿传达。|訛りで人を判断してはいけません。意味と気持ちを訳し、想いをそのまま届けます。|누구도 억양으로 판단받아서는 안 됩니다. 의미와 감정을 번역해 생각이 의도대로 전달되게 합니다.',

sy1:'لم تبدأ «وِصلة» كفكرة تقنية على شاشة، بل وُلدت من تجربة إنسانية حقيقية عشتُها ورأيتُ تفاصيلها بعيني بسبب الحرب في بلدي السودان. في أوقات الحرب والنزوح، يواجه الإنسان معاناة في كل شيء، لكن هناك أمراً بسيطاً جداً قلّما ينتبه إليه أحد رغم أنه يمسّ حياة الإنسان كل يوم: اللغة واللهجة.<br><br>رأيتُ كيف يعاني أبناء وطني في البداية لكي يفهموا لهجات البلدان الجديدة التي انتقلوا إليها، وحتى داخل البلدان العربية الشقيقة، يمرّون في البداية بفترة تأقلم ليست سهلة لفهم تفاصيل اللهجة المحلية والتعبير عن أنفسهم بيسر قبل أن يندمجوا في المجتمع، رغم أن لغتنا الأم واحدة! فتخيّلوا حجم المعاناة عندما يُجبر إنسان على العيش أو طلب العلاج في بلد لا يتحدث لغته على الإطلاق.<br><br>أنا لينا، مترجمة شابة أؤمن بأن اللغة ليست مجرد أداة للكلام، بل هي بوابة للرحمة والاهتمام. أنشأتُ «وِصلة» لتبقى مبادرة إنسانية مجانية 100% ومستقلة للأبد؛ ليس هدفها أن تكون محرك ترجمة أو مشروعاً ربحياً، بل هدفها الوحيد أن توصل صوت وطني ومعاناة كل إنسان غريب، وأن تكون جسراً دافئاً يذكّر العالم دائماً بأن المشكلة ليست أنهم لا يتحدثون.. بل أننا لا نستمع.|Wisla did not begin as a technical idea on a screen. It was born from a real human experience that I lived and saw in every detail with my own eyes, because of the war in my country, Sudan. In times of war and displacement, people suffer in every way, but there is one very simple matter that hardly anyone notices even though it touches a person’s life every single day: language and dialect.<br><br>I saw how my people struggle at first just to understand the dialects of the new countries they moved to. And even within fellow Arab countries, they go through a challenging adjustment period at first to grasp local dialect nuances and express themselves comfortably before integrating into society, even though we share the same mother tongue! So imagine the scale of the suffering when a person is forced to live, or to seek medical treatment, in a country whose language they do not speak at all.<br><br>I am Lina, a young translator who believes that language is not merely a tool for speaking, but a gateway to compassion and care. I created Wisla to remain a 100% free and independent humanitarian initiative, forever. Its goal is not to be a translation engine or a profit-making project, but solely to carry the voice of my homeland and the suffering of every stranger, and to be a warm bridge that always reminds the world that the problem is not that they do not speak.. it is that we do not listen.|Wisla begann nicht als technische Idee auf einem Bildschirm, sondern wurde aus einer echten menschlichen Erfahrung geboren, die ich selbst durchlebt und in allen Einzelheiten mit eigenen Augen gesehen habe – wegen des Krieges in meinem Land, dem Sudan. In Zeiten von Krieg und Vertreibung leiden Menschen in jeder Hinsicht, doch es gibt eine ganz einfache Sache, die kaum jemand bemerkt, obwohl sie das Leben eines Menschen jeden Tag berührt: Sprache und Dialekt.<br><br>Ich habe gesehen, wie sich meine Landsleute anfangs schwertun, allein die Dialekte der neuen Länder zu verstehen, in die sie gekommen sind. Und selbst in den arabischen Schwesterländern durchlaufen sie anfangs eine herausfordernde Eingewöhnungszeit, um die Nuancen des lokalen Dialekts zu erfassen und sich unbeschwert auszudrücken, bevor sie sich in die Gesellschaft integrieren – obwohl wir dieselbe Muttersprache teilen! Stellt euch also vor, wie groß das Leid ist, wenn ein Mensch gezwungen ist, in einem Land zu leben oder dort medizinische Hilfe zu suchen, dessen Sprache er überhaupt nicht spricht.<br><br>Ich bin Lina, eine junge Übersetzerin, die glaubt, dass Sprache nicht bloß ein Werkzeug zum Sprechen ist, sondern ein Tor zu Mitgefühl und Fürsorge. Ich habe Wisla geschaffen, damit es für immer eine zu 100 % kostenlose und unabhängige humanitäre Initiative bleibt. Es soll keine Übersetzungsmaschine und kein Gewinnprojekt sein, sondern einzig die Stimme meiner Heimat und das Leid jedes Fremden weitertragen und eine warme Brücke sein, die die Welt immer daran erinnert: Das Problem ist nicht, dass sie nicht sprechen.. sondern dass wir nicht zuhören.|Wisla non è nata come un’idea tecnica su uno schermo, ma da un’esperienza umana autentica che ho vissuto e di cui ho visto ogni dettaglio con i miei occhi, a causa della guerra nel mio Paese, il Sudan. In tempi di guerra e di sfollamento, le persone soffrono in ogni aspetto, ma c’è una cosa semplicissima che quasi nessuno nota, pur toccando la vita di ognuno ogni giorno: la lingua e il dialetto.<br><br>Ho visto quanto faticano all’inizio i miei connazionali anche solo a capire i dialetti dei nuovi Paesi in cui si sono trasferiti. E anche nei Paesi arabi fratelli attraversano all’inizio un periodo di adattamento non facile per cogliere le sfumature del dialetto locale ed esprimersi con naturalezza prima di integrarsi nella società, pur condividendo la stessa lingua madre! Immaginate dunque la portata della sofferenza quando una persona è costretta a vivere, o a cercare cure, in un Paese di cui non parla affatto la lingua.<br><br>Sono Lina, una giovane traduttrice che crede che la lingua non sia solo uno strumento per parlare, ma una porta verso la compassione e l’attenzione. Ho creato Wisla perché resti per sempre un’iniziativa umanitaria gratuita al 100% e indipendente; il suo scopo non è essere un motore di traduzione né un progetto a scopo di lucro, ma solo portare la voce del mio Paese e la sofferenza di ogni persona straniera, ed essere un ponte caldo che ricordi sempre al mondo che il problema non è che non parlino.. ma che noi non ascoltiamo.|Wisla n’a pas commencé comme une idée technique sur un écran, mais est née d’une véritable expérience humaine que j’ai vécue et dont j’ai vu chaque détail de mes propres yeux, à cause de la guerre dans mon pays, le Soudan. En temps de guerre et de déplacement, l’être humain souffre en tout, mais il est une chose toute simple que presque personne ne remarque alors qu’elle touche chaque jour la vie de chacun : la langue et le dialecte.<br><br>J’ai vu combien les miens peinent au début ne serait-ce qu’à comprendre les dialectes des nouveaux pays où ils se sont installés. Et même au sein des pays arabes frères, ils traversent au départ une période d’adaptation difficile pour saisir les nuances du dialecte local et s’exprimer avec aisance avant de s’intégrer à la société, alors que nous partageons la même langue maternelle ! Imaginez alors l’ampleur de la souffrance lorsqu’une personne est contrainte de vivre, ou de chercher des soins, dans un pays dont elle ne parle pas du tout la langue.<br><br>Je suis Lina, une jeune traductrice qui croit que la langue n’est pas seulement un outil pour parler, mais une porte vers la compassion et l’attention. J’ai créé Wisla pour qu’elle reste à jamais une initiative humanitaire gratuite à 100 % et indépendante ; son but n’est pas d’être un moteur de traduction ni un projet lucratif, mais uniquement de porter la voix de mon pays et la souffrance de chaque personne étrangère, et d’être un pont chaleureux qui rappelle toujours au monde que le problème n’est pas qu’ils ne parlent pas.. mais que nous n’écoutons pas.|Wisla no empezó como una idea técnica en una pantalla, sino que nació de una experiencia humana real que viví y cuyos detalles vi con mis propios ojos a causa de la guerra en mi país, Sudán. En tiempos de guerra y desplazamiento, las personas sufren en todo, pero hay algo muy sencillo en lo que casi nadie repara, aunque toca la vida de cada persona todos los días: el idioma y el dialecto.<br><br>Vi cómo los míos tienen dificultades al principio solo para entender los dialectos de los nuevos países a los que llegaron. E incluso dentro de los países árabes hermanos, atraviesan al principio un período de adaptación difícil para captar los matices del dialecto local y expresarse con comodidad antes de integrarse en la sociedad, ¡aunque compartimos la misma lengua materna! Imaginen entonces la magnitud del sufrimiento cuando una persona se ve obligada a vivir, o a buscar atención médica, en un país cuyo idioma no habla en absoluto.<br><br>Soy Lina, una joven traductora que cree que el idioma no es solo una herramienta para hablar, sino una puerta a la compasión y al cuidado. Creé Wisla para que siga siendo para siempre una iniciativa humanitaria 100 % gratuita e independiente; su objetivo no es ser un motor de traducción ni un proyecto con fines de lucro, sino únicamente llevar la voz de mi patria y el sufrimiento de cada persona extranjera, y ser un puente cálido que recuerde siempre al mundo que el problema no es que no hablen.. sino que nosotros no escuchamos.|Wisla并不是屏幕上冒出来的一个技术想法，而是源于一段真实的人生经历——因为我的祖国苏丹的战争，我亲身经历并亲眼看到了其中的种种细节。在战争与流离失所的岁月里，人们在方方面面都在受苦，但有一件极其简单的事，虽然每天都影响着人的生活，却几乎没有人留意：语言和方言。<br><br>我看到我的同胞们起初是多么艰难，仅仅为了听懂他们所迁往的新国家的方言。即使在阿拉伯兄弟国家之间，他们起初也要经历一段不轻松的适应期，去领会当地方言的细微差别、自如地表达自己，然后才能融入当地社会——尽管我们拥有同一种母语！那么，请想象一下，当一个人被迫在一个完全不会说其语言的国家生活或求医时，他承受的痛苦有多大。<br><br>我是莉娜，一名年轻的翻译，我相信语言不仅仅是说话的工具，更是通往同情与关怀的大门。我创办Wisla，是要让它永远是一个100%免费、独立的人道主义倡议；它的目标不是成为翻译引擎或盈利项目，而是唯一地传递我祖国的声音和每一位异乡人的苦难，成为一座温暖的桥梁，时刻提醒世界：问题不在于他们不说话……而在于我们不倾听。|Wislaは、画面の上の技術的なアイデアとして始まったのではありません。私の祖国スーダンでの戦争のために、私自身が経験し、細部までこの目で見た、実際の人間の体験から生まれました。戦争と避難のさなか、人はあらゆることで苦しみますが、毎日の暮らしに関わっているのに、ほとんど誰も気づかない、とても単純なことがあります。それは言葉と方言です。<br><br>私の同胞が、移り住んだ新しい国の方言を理解するだけでも、最初はどれほど苦労するかを見てきました。同じアラブの兄弟国の中でさえ、最初は容易ではない適応の期間を経て、現地の方言のニュアンスを理解し、気兼ねなく自分を表現できるようになってから、ようやく社会に溶け込んでいきます。私たちは同じ母語を共有しているのに、です！ ならば、その言葉をまったく話せない国で暮らしたり、治療を求めたりすることを強いられた人の苦しみが、どれほど大きいか想像してみてください。<br><br>私はリナ。言葉は単に話すための道具ではなく、思いやりと気遣いへの扉だと信じている、若い翻訳者です。Wislaは、永遠に100％無料で独立した人道的な取り組みであり続けるように作りました。翻訳エンジンや営利事業になることが目的ではなく、ただ私の祖国の声と、見知らぬ土地にいるすべての人の苦しみを届け、「問題は彼らが話さないことではなく、私たちが耳を傾けないことだ」と世界に思い出させる温かい架け橋になること、それだけが目的です。|Wisla는 화면 속의 기술적 아이디어로 시작된 것이 아닙니다. 제 조국 수단의 전쟁 때문에 제가 직접 겪고 모든 세부를 두 눈으로 목격한 진짜 인간적 경험에서 태어났습니다. 전쟁과 피란의 시간 속에서 사람들은 모든 면에서 고통받지만, 매일 사람의 삶에 닿아 있음에도 거의 아무도 알아차리지 못하는 아주 단순한 문제가 있습니다. 바로 언어와 방언입니다.<br><br>저는 제 동포들이 옮겨 간 새 나라의 방언을 이해하는 것만으로도 처음에 얼마나 힘들어하는지 보았습니다. 같은 아랍 형제 국가들 안에서도 처음에는 쉽지 않은 적응 기간을 거치며 현지 방언의 미묘한 차이를 이해하고 편안하게 자신을 표현할 수 있게 된 뒤에야 사회에 어우러집니다. 우리는 모두 같은 모국어를 쓰는데도 말입니다! 그렇다면 그 나라 말을 전혀 하지 못하는 곳에서 살거나 치료를 받아야만 하는 사람의 고통이 얼마나 클지 상상해 보세요.<br><br>저는 리나, 언어가 단순히 말하기 위한 도구가 아니라 연민과 배려로 가는 관문이라고 믿는 젊은 번역가입니다. 저는 Wisla를 영원히 100% 무료이며 독립적인 인도주의 활동으로 남도록 만들었습니다. 번역 엔진이나 수익 사업이 되는 것이 아니라, 오직 제 조국의 목소리와 낯선 땅에 있는 모든 사람의 고통을 전하고, 문제는 그들이 말하지 않는 것이 아니라 우리가 듣지 않는 것임을 세상에 늘 일깨우는 따뜻한 다리가 되는 것이 유일한 목적입니다.',

<script>
/* wisla v3 additions (additive only): host-country priority, 2-way mode, emergency flashcard, offline */
(function(){
var NW={
'gp':'─── لغات دول الاستضافة (الأولوية) ───|─── Host-country languages (priority) ───|─── Sprachen der Aufnahmeländer (Priorität) ───|─── Lingue dei Paesi ospitanti (priorità) ───|─── Langues des pays d’accueil (prioritaires) ───|─── Idiomas de los países de acogida (prioritarios) ───|─── 接收国语言（优先）───|─── 受け入れ国の言語（優先）───|─── 수용국 언어(우선) ───',
'cv1':'💬 وضع المحادثة ثنائية الاتجاه|💬 2-Way Conversation Mode|💬 Zwei-Wege-Gesprächsmodus|💬 Modalità conversazione bidirezionale|💬 Mode conversation à double sens|💬 Modo de conversación bidireccional|💬 双向对话模式|💬 双方向会話モード|💬 양방향 대화 모드',
'cv2':'🎙️ الشخص أ يتحدث|🎙️ Person A Speaks|🎙️ Person A spricht|🎙️ Parla la persona A|🎙️ La personne A parle|🎙️ Habla la persona A|🎙️ A 说话|🎙️ Aさんが話す|🎙️ A가 말하기',
'cv3':'🎙️ الشخص ب يتحدث|🎙️ Person B Speaks|🎙️ Person B spricht|🎙️ Parla la persona B|🎙️ La personne B parle|🎙️ Habla la persona B|🎙️ B 说话|🎙️ Bさんが話す|🎙️ B가 말하기',
'cv4':'الشخص أ يتحدث بلغة «من» ويُترجم كلامه صوتيًا إلى لغة «إلى»، والشخص ب يفعل العكس.|Person A speaks the “From” language and is translated aloud into the “To” language; Person B does the opposite.|Person A spricht die „Von“-Sprache und wird laut in die „Nach“-Sprache übersetzt; Person B macht das Umgekehrte.|La persona A parla la lingua “Da” e viene tradotta a voce nella lingua “A”; la persona B fa il contrario.|La personne A parle la langue « De » et est traduite à voix haute dans la langue « Vers » ; la personne B fait l’inverse.|La persona A habla el idioma “De” y se traduce en voz alta al idioma “A”; la persona B hace lo contrario.|A 说“从”语言，会被语音翻译成“到”语言；B 则相反。|Aさんは「翻訳元」の言語で話し、「翻訳先」の言語に音声で訳されます。Bさんはその逆です。|A는 “출발” 언어로 말하면 “도착” 언어로 음성 번역되고, B는 그 반대입니다.',
'cva':'أ|A|A|A|A|A|A|A|A',
'cvb':'ب|B|B|B|B|B|B|B|B',
'fc1':'🔊 انطق بصوت عالٍ|🔊 Speak Aloud|🔊 Laut vorlesen|🔊 Leggi ad alta voce|🔊 Lire à voix haute|🔊 Leer en voz alta|🔊 朗读|🔊 声に出して読む|🔊 소리 내어 읽기',
'of1':'📲 حفظ للاستخدام دون اتصال|📲 Save Offline|📲 Offline speichern|📲 Salva offline|📲 Enregistrer hors ligne|📲 Guardar sin conexión|📲 离线保存|📲 オフライン保存|📲 오프라인 저장',
'of2':'تم الحفظ — يعمل الآن دون اتصال ✓|Saved — works offline now ✓|Gespeichert – funktioniert jetzt offline ✓|Salvato: ora funziona offline ✓|Enregistré : fonctionne maintenant hors ligne ✓|Guardado: ya funciona sin conexión ✓|已保存——现在可离线使用 ✓|保存しました。オフラインで使えます ✓|저장됨 — 이제 오프라인에서 작동합니다 ✓',
'of3':'الحفظ دون اتصال غير متاح في هذا المتصفح أو هذه الصفحة.|Offline saving isn’t available in this browser or on this page.|Offline-Speichern ist in diesem Browser oder auf dieser Seite nicht verfügbar.|Il salvataggio offline non è disponibile in questo browser o in questa pagina.|L’enregistrement hors ligne n’est pas disponible dans ce navigateur ou sur cette page.|El guardado sin conexión no está disponible en este navegador o en esta página.|此浏览器或此页面不支持离线保存。|このブラウザまたはページではオフライン保存を利用できません。|이 브라우저 또는 이 페이지에서는 오프라인 저장을 사용할 수 없습니다.'};
try{for(var k in NW){R[k]=NW[k];T[k]=NW[k].split('|')}}catch(e){}

/* 4. refugee host-country languages first in the target dropdown */
try{
var HG=[['tr-TR','التركية (Turkish)'],['de-DE','الألمانية (German)'],['nl-NL','الهولندية (Dutch)'],['sv-SE','السويدية (Swedish)'],['el-GR','اليونانية (Greek)'],['en-US','الإنجليزية (English)'],['fr-FR','الفرنسية (French)']];
var toS=$('#to'),og=document.createElement('optgroup');og.dataset.g='gp';
HG.forEach(function(h){var e=document.createElement('option');e.value=h[0];e.textContent=h[1];og.appendChild(e)});
toS.insertBefore(og,toS.firstChild);
}catch(e){}

/* shared translate helper (same engine order as the main translator) */
async function cvTx(x,fv,tv){
try{stat('t')}catch(e){}
if(AR(fv)&&AR(tv))return dia(x,DL[fv],DL[tv]);
var s=code(fv),d=code(tv),q=x;
if(AR(fv)&&fv!=='ar-SA')q=dia(x,DL[fv],0);
var y=s===d?q:(await mm(q,s,d)||await lg(q,s,d));
if(y&&AR(tv)&&tv!=='ar-SA')y=dia(y,0,DL[tv]);
return y||null}
function optTxt(sel){var o=sel.selectedOptions[0];return o?o.textContent:''}

/* 2. two-way conversation mode */
try{
var crec=null,tg=$('#cvT'),bx=$('#cvBox');
tg.onclick=function(){var on=bx.hidden;bx.hidden=!on;tg.setAttribute('aria-expanded',on?'true':'false')};
var cvSt=function(x){$('#cvSt').textContent=x||''};
var cvAdd=function(side,x,y){var d=document.createElement('div'),s=document.createElement('small'),a=document.createElement('span'),b=document.createElement('b');
d.className='cvm';s.textContent=t(side==='a'?'cva':'cvb');a.textContent=x;b.textContent=y;d.append(s,a,b);var l=$('#cvLog');l.insertBefore(d,l.firstChild)};
var cvDo=async function(side,x,sl,dl){cvSt(t('t12'));var y=null;try{y=await cvTx(x.slice(0,500),sl,dl)}catch(e){}
if(!y){cvSt(t('net1'));return}cvSt('');cvAdd(side,x,y);say(y,dl)};
var cvListen=function(side){
try{speechSynthesis.cancel()}catch(e){}
if(crec){try{crec.stop()}catch(e){}return}
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){cvSt(t('me3'));return}
var fv=$('#from').value,tv=$('#to').value;
if(fv.indexOf('x-')===0||tv.indexOf('x-')===0){cvSt(t('t13'));return}
var A=side==='a',sl=A?fv:tv,dl=A?tv:fv,btn=A?$('#cvA'):$('#cvB'),err=false,txt='';
try{var r=crec=new SR();r.lang=sl;r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
r.onstart=function(){btn.classList.add('live');cvSt(t('t5'))};
r.onresult=function(e){var a='';for(var k=0;k<e.results.length;k++)a+=e.results[k][0].transcript;txt=a};
r.onerror=function(e){if(e.error==='aborted')return;err=true;cvSt(t(MERR[e.error]||'me2'))};
r.onend=function(){crec=null;btn.classList.remove('live');if(err)return;if(txt.trim()){cvDo(side,txt.trim(),sl,dl)}else{cvSt(t('me2'))}};
r.start()}catch(e){crec=null;btn.classList.remove('live')}};
$('#cvA').onclick=function(){cvListen('a')};
$('#cvB').onclick=function(){cvListen('b')};
}catch(e){}

/* 3. full-screen bilingual emergency flashcard */
try{
var fcEl=$('#fc'),fcFrom=null,fcSay='',fcLang='';
var phrase=function(key,lang){var i=LN.indexOf(code(lang)),a=T[key];return(i>=0&&a)?(a[i]||a[1]):null};
var fcClose=function(){fcEl.classList.remove('on');try{speechSynthesis.cancel()}catch(e){}if(fcFrom&&fcFrom.focus)try{fcFrom.focus()}catch(e){}};
var fcOpen=async function(key,opener){
var sl=$('#from').value,tv=$('#to').value,sT=$('#fcS'),tT=$('#fcT');
fcFrom=opener;fcSay='';fcLang=tv;
$('#fcSl').textContent=optTxt($('#from'));$('#fcTl').textContent=optTxt($('#to'));
sT.textContent=phrase(key,sl)||t(key);sT.lang=code(sl)||'';sT.dir=AR(sl)?'rtl':'ltr';
tT.lang=code(tv)||'';tT.dir=AR(tv)?'rtl':'ltr';tT.textContent=t('t12');
fcEl.classList.add('on');$('#fcCl').focus();
var y=null;
try{
if(tv.indexOf('x-')===0){tT.dir='auto';tT.textContent=t('t13');return}
y=phrase(key,tv);
if(y){if(AR(tv)&&tv!=='ar-SA')y=dia(y,0,DL[tv])}
else{y=await cvTx(T[key][1],'en-US',tv)}
}catch(e){y=null}
if(!fcEl.classList.contains('on')||fcLang!==tv)return;
if(!y){tT.dir='auto';tT.textContent=t('net1');return}
tT.textContent=y;fcSay=y};
$$('#qp .btn').forEach(function(b){b.addEventListener('click',function(){fcOpen(b.dataset.q,b)})});
$('#fcSp').onclick=function(){if(fcSay)say(fcSay,fcLang)};
$('#fcCl').onclick=fcClose;
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&fcEl.classList.contains('on'))fcClose()});
}catch(e){}

/* 5. Save Offline: register a service worker so the page shell reloads without a connection.
   Browsers refuse blob:/data: service-worker URLs, so the worker is the small sw.js file next to index.html. */
try{
var swReg=function(){
if(!('serviceWorker' in navigator)||!window.isSecureContext)return Promise.reject(new Error('nosw'));
return navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready})};
window.addEventListener('load',function(){try{swReg().catch(function(){})}catch(e){}});
var ob=$('#tOff');
ob.onclick=function(){
var say2=function(k){ob.textContent=t(k);setTimeout(function(){ob.textContent=t('of1')},3500)};
try{swReg().then(function(){say2('of2')}).catch(function(){say2('of3')})}catch(e){say2('of3')}};
}catch(e){}

try{setLang(LI)}catch(e){}
})();
</script>
</body>
</html>
